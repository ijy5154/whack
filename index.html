<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>초인 뽕망치 디펜스</title>
    <style>
        body {
            font-family: 'Malgun Gothic', sans-serif;
            background-color: #2c3e50;
            color: white;
            text-align: center;
            margin: 0;
            padding: 20px;
            user-select: none;
        }
        h1 { color: #f1c40f; margin-bottom: 10px; }
        .status-container {
            display: flex;
            justify-content: center;
            gap: 20px;
            font-size: 1.2rem;
            margin-bottom: 10px;
            background: #34495e;
            padding: 10px;
            border-radius: 10px;
        }
        .skills-container {
            font-size: 0.9rem;
            color: #bdc3c7;
            margin-bottom: 20px;
        }
        /* 게임판 */
        .grid {
            display: grid;
            grid-template-columns: repeat(3, 110px);
            grid-gap: 20px;
            justify-content: center;
            margin: 20px auto;
        }
        .hole {
            width: 110px;
            height: 110px;
            background: #8e44ad;
            border-radius: 50%;
            position: relative;
            overflow: hidden;
            border: 4px solid #4a148c;
            box-shadow: inset 0 10px 0 rgba(0,0,0,0.3);
        }
        .mole {
            width: 100%;
            height: 100%;
            background: #d35400;
            border-radius: 50%;
            position: absolute;
            top: 100%;
            transition: top 0.2s ease;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-weight: bold;
            font-size: 0.9rem;
        }
        .mole.up { top: 0; }
        /* 두더지 상태 상태 이펙트 */
        .mole.frozen { background: #3498db !important; }
        .mole.shocked { background: #f1c40f !important; color: #000; }
        
        /* 체력바 */
        .hp-bar {
            width: 80%;
            height: 10px;
            background: #c0392b;
            border-radius: 5px;
            margin-top: 5px;
            overflow: hidden;
        }
        .hp-fill {
            width: 100%;
            height: 100%;
            background: #2ecc71;
            transition: width 0.1s linear;
        }

        /* 카드 선택 모달 */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85);
            justify-content: center;
            align-items: center;
            z-index: 100;
        }
        .modal-content {
            background: #34495e;
            padding: 30px;
            border-radius: 15px;
            border: 3px solid #f1c40f;
            max-width: 500px;
            width: 90%;
        }
        .card-wrapper {
            display: flex;
            justify-content: space-around;
            margin-top: 20px;
            gap: 15px;
        }
        .card {
            background: #1abc9c;
            border: 2px solid #fff;
            border-radius: 10px;
            padding: 15px 10px;
            width: 30%;
            cursor: pointer;
            transition: transform 0.2s, background 0.2s;
            color: #fff;
        }
        .card:hover {
            transform: scale(1.05);
            background: #16a085;
        }
        .card h3 { margin: 0 0 10px 0; font-size: 1.1rem; color: #f1c40f;}
        .card p { margin: 0; font-size: 0.85rem; line-height: 1.3; }

        button {
            background: #e67e22;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 1.1rem;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 10px;
        }
        button:hover { background: #d35400; }
    </style>
</head>
<body>

    <h1>🔨 초인 뽕망치 디펜스</h1>
    
    <div class="status-container">
        <div>스테이지: <span id="stage">1</span></div>
        <div>남은 시간: <span id="timer">20</span>초</div>
        <div>점수: <span id="score">0</span></div>
    </div>

    <div class="skills-container">
        <strong>현재 강화 상태:</strong> 
        망치 데미지: <span id="stat-dmg">10</span> | 
        얼음(빙결): <span id="stat-ice">0</span>% | 
        광범위(폭발): <span id="stat-aoe">0</span>% | 
        전기(연쇄): <span id="stat-elec">0</span>%
    </div>

    <button id="start-btn" onclick="startGame()">게임 시작</button>

    <div class="grid">
        <div class="hole"><div class="mole" data-id="0"></div></div>
        <div class="hole"><div class="mole" data-id="1"></div></div>
        <div class="hole"><div class="mole" data-id="2"></div></div>
        <div class="hole"><div class="mole" data-id="3"></div></div>
        <div class="hole"><div class="mole" data-id="4"></div></div>
        <div class="hole"><div class="mole" data-id="5"></div></div>
        <div class="hole"><div class="mole" data-id="6"></div></div>
        <div class="hole"><div class="mole" data-id="7"></div></div>
        <div class="hole"><div class="mole" data-id="8"></div></div>
    </div>

    <!-- 카드 보상 보관 모달 -->
    <div class="modal" id="card-modal">
        <div class="modal-content">
            <h2>🎉 스테이지 클리어! 보상 선택</h2>
            <p>중첩할 특수 능력 카드를 하나 선택하세요.</p>
            <div class="card-wrapper" id="card-list">
                <!-- 자바스크립트로 카드 생성 -->
            </div>
        </div>
    </div>

    <script>
        // 게임 세팅 및 기본 상태
        const STAGE_TIME = 20; // 스테이지당 버텨야 하는 시간(초)
        let stage = 1;
        let timeLeft = STAGE_TIME;
        let score = 0;
        let gameActive = false;
        let gameTimer, moleTimer;

        // 플레이어 능력치 (아이템 카드 선택으로 영구 중첩됨)
        const playerStats = {
            damage: 10,       // 기본 망치 화력
            iceChance: 0,     // 얼음 스킬 확률 (%) - 두더지를 3초간 멈춤
            aoeChance: 0,     // 광범위 폭발 확률 (%) - 주변 두더지 전원 타격
            elecChance: 0     // 전기 연쇄 확률 (%) - 살아있는 다른 두더지 추가 타격
        };

        // 두더지 데이터 관리
        const moles = Array.from({length: 9}, (_, i) => ({
            id: i,
            hp: 10,
            maxHp: 10,
            isUp: false,
            isFrozen: false,
            isShocked: false,
            timeoutId: null
        }));

        // 카드 풀 데이터
        const cardPool = [
            { id: 'dmg', title: '🔥 핵망치', desc: '망치 기본 화력 +8 증가', effect: () => playerStats.damage += 8 },
            { id: 'ice', title: '❄️ 서리한', desc: '공격 시 15% 확률로 3초 빙결 (행동불가)', effect: () => playerStats.iceChance += 15 },
            { id: 'aoe', title: '💥 지진파', desc: '공격 시 12% 확률로 주변 전원 스플래시 데미지', effect: () => playerStats.aoeChance += 12 },
            { id: 'elec', title: '⚡ 짜릿함', desc: '공격 시 15% 확률로 전도되어 다른 두더지 연쇄 타격', effect: () => playerStats.elecChance += 15 }
        ];

        const moleElements = document.querySelectorAll('.mole');

        // UI 업데이트
        function updateUI() {
            document.getElementById('stage').innerText = stage;
            document.getElementById('timer').innerText = timeLeft;
            document.getElementById('score').innerText = score;
            document.getElementById('stat-dmg').innerText = playerStats.damage;
            document.getElementById('stat-ice').innerText = playerStats.iceChance;
            document.getElementById('stat-aoe').innerText = playerStats.aoeChance;
            document.getElementById('stat-elec').innerText = playerStats.elecChance;
        }

        // 게임 시작
        function startGame() {
            if (gameActive) return;
            gameActive = true;
            timeLeft = STAGE_TIME;
            document.getElementById('start-btn').style.display = 'none';
            updateUI();

            // 타이머 구동
            gameTimer = setInterval(() => {
                timeLeft--;
                updateUI();

                if (timeLeft <= 0) {
                    endStage();
                }
            }, 1000);

            // 두더지 출현 루프 시작
            spawnMoleLoop();
        }

        // 두더지 리스폰 제어 (스테이지가 오를수록 리스폰 주기가 빨라짐)
        function spawnMoleLoop() {
            if (!gameActive) return;
            
            const delay = Math.max(300, 1000 - (stage * 80)); // 스테이지 상승시 더 자주 나옴
            popMole();
            
            moleTimer = setTimeout(spawnMoleLoop, delay);
        }

        // 두더지 튀어나오기
        function popMole() {
            const activeMoles = moles.filter(m => !m.isUp);
            if (activeMoles.length === 0) return;

            // 랜덤 두더지 선택
            const randMole = activeMoles[Math.floor(Math.random() * activeMoles.length)];
            const el = moleElements[randMole.id];

            // 스테이지 비례 체력 설정 (스테이지당 최대 체력 15씩 증가)
            randMole.maxHp = 10 + (stage - 1) * 15;
            randMole.hp = randMole.maxHp;
            randMole.isUp = true;
            randMole.isFrozen = false;
            randMole.isShocked = false;

            // 두더지 UI 구성 (체력바 포함)
            el.innerHTML = `<div>HP</div><div class="hp-bar"><div class="hp-fill" id="hp-${randMole.id}" style="width:100%"></div></div>`;
            el.className = 'mole up';

            // 두더지가 들어가는 시간도 스테이지가 오를수록 빨라짐
            const upTime = Math.max(800, 2500 - (stage * 150));

            randMole.timeoutId = setTimeout(() => {
                downMole(randMole.id);
            }, upTime);
        }

        // 두더지 들어가기
        function downMole(id) {
            const mole = moles[id];
            if (!mole.isUp) return;

            // 빙결 상태면 들어가기 타이머 유예
            if (mole.isFrozen) {
                mole.timeoutId = setTimeout(() => downMole(id), 1000);
                return;
            }

            mole.isUp = false;
            moleElements[id].className = 'mole';
            moleElements[id].innerHTML = '';
            clearTimeout(mole.timeoutId);
        }

        // 뽕망치 타격 (클릭 이벤트)
        moleElements.forEach(el => {
            el.addEventListener('mousedown', (e) => {
                const id = parseInt(e.currentTarget.getAttribute('data-id'));
                if (!moles[id].isUp) return;

                // 1. 기본 타격 수행
                hitMole(id, playerStats.damage);

                // --- 특수 스킬 중첩 발동 체크 ---
                // 2. 얼음 스킬 (빙결)
                if (Math.random() * 100 < playerStats.iceChance) {
                    triggerIce(id);
                }

                // 3. 광범위 스킬 (주변 타격 - 상하좌우 및 대각선 타격)
                if (Math.random() * 100 < playerStats.aoeChance) {
                    triggerAoe(id);
                }

                // 4. 전기 스킬 (체인이 되어 살아있는 다른 타겟 공격)
                if (Math.random() * 100 < playerStats.elecChance) {
                    triggerElectric(id);
                }
            });
        });

        // 개별 두더지 데미지 계산 및 처리
        function hitMole(id, damage) {
            const mole = moles[id];
            if (!mole.isUp) return;

            mole.hp -= damage;
            
            // 체력바 업데이트
            const hpFill = document.getElementById(`hp-${id}`);
            if (hpFill) {
                const percent = Math.max(0, (mole.hp / mole.maxHp) * 100);
                hpFill.style.width = percent + '%';
            }

            // 두더지 사망 처리
            if (mole.hp <= 0) {
                score += mole.maxHp; // 강한 두더지일수록 점수 가산
                updateUI();
                downMole(id);
            }
        }

        // [얼음 스킬 효과] 두더지를 얼려 움직이지 못하게 만듦
        function triggerIce(id) {
            const mole = moles[id];
            if (!mole.isUp || mole.isFrozen) return;

            mole.isFrozen = true;
            moleElements[id].classList.add('frozen');

            // 3초 후 빙결 해제
            setTimeout(() => {
                if (moles[id]) {
                    moles[id].isFrozen = false;
                    moleElements[id].classList.remove('frozen');
                }
            }, 3000);
        }

        // [광범위 스킬 효과] 격자 배열 기준 주변 두더지들에게 스플래시 데미지
        function triggerAoe(centerId) {
            const neighbors = [
                centerId - 3, centerId + 3,
            ];
            if (centerId % 3 !== 0) neighbors.push(centerId - 1, centerId - 4, centerId + 2);
            if (centerId % 3 !== 2) neighbors.push(centerId + 1, centerId - 2, centerId + 4);

            neighbors.forEach(nid => {
                if (nid >= 0 && nid < 9 && moles[nid].isUp) {
                    hitMole(nid, Math.floor(playerStats.damage * 0.7)); 
                }
            });
        }

        // [전기 스킬 효과] 튀어나와 있는 임의의 다른 두더지에게 번개 전도
        function triggerElectric(originId) {
            const otherMoles = moles.filter(m => m.isUp && m.id !== originId);
            if (otherMoles.length === 0) return;

            const chainTarget = otherMoles[Math.floor(Math.random() * otherMoles.length)];
            const targetEl = moleElements[chainTarget.id];

            targetEl.classList.add('shocked');
            hitMole(chainTarget.id, Math.floor(playerStats.damage * 0.8));

            setTimeout(() => {
                targetEl.classList.remove('shocked');
            }, 200);
        }

        // 스테이지 종료 및 시간 버티기 성공
        function endStage() {
            gameActive = false;
            clearInterval(gameTimer);
            clearTimeout(moleTimer);

            moles.forEach(m => { if(m.isUp) downMole(m.id); });
            openRewardModal();
        }

        // 랜덤 카드 3개 추첨 및 모달 오픈
        function openRewardModal() {
            const modal = document.getElementById('card-modal');
            const cardListContainer = document.getElementById('card-list');
            cardListContainer.innerHTML = '';

            const shuffled = [...cardPool].sort(() => 0.5 - Math.random());
            const selectedCards = shuffled.slice(0, 3);

            selectedCards.forEach(cardData => {
                const cardEl = document.createElement('div');
                cardEl.className = 'card';
                cardEl.innerHTML = `
                    <h3>${cardData.title}</h3>
                    <p>${cardData.desc}</p>
                `;
                cardEl.onclick = () => selectCard(cardData);
                cardListContainer.appendChild(cardEl);
            });

            modal.style.display = 'flex';
        }

        // 카드 선택 및 다음 스테이지 준비
        function selectCard(cardData) {
            cardData.effect();
            document.getElementById('card-modal').style.display = 'none';
            stage++;
            updateUI();
            
            document.getElementById('start-btn').style.display = 'inline-block';
            document.getElementById('start-btn').innerText = `스테이지 ${stage} 시작`;
        }
    </script>
</body>
</html>
