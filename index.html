            function ensureAudioContext() {
                if (!audioContext) {
                    const audioContextClass =
                        window.AudioContext || window.webkitAudioContext;
                    audioContext = new audioContextClass();
                }

                if (audioContext.state === "suspended") {
                    audioContext.resume();
                }
            }

            function playTone(
                frequency,
                duration = 0.2,
                waveType = "sine",
                volume = 0.03,
                startDelay = 0,
            ) {
                if (!audioContext) {
                    return;
                }

                const startTime = audioContext.currentTime + startDelay;
                const endTime = startTime + duration;
                const oscillator = audioContext.createOscillator();
                const gainNode = audioContext.createGain();

                oscillator.type = waveType;
                oscillator.frequency.setValueAtTime(frequency, startTime);

                gainNode.gain.setValueAtTime(0.0001, startTime);
                gainNode.gain.linearRampToValueAtTime(volume, startTime + 0.02);
                gainNode.gain.exponentialRampToValueAtTime(0.0001, endTime);

                oscillator.connect(gainNode);
                gainNode.connect(audioContext.destination);

                oscillator.start(startTime);
                oscillator.stop(endTime + 0.02);
            }

            function startBgm() {
                ensureAudioContext();
                if (bgmIntervalId) {
                    return;
                }

                bgmStep = 0;
                bgmIntervalId = setInterval(() => {
                    const note = bgmPattern[bgmStep % bgmPattern.length];
                    const accent = bgmStep % 4 === 0 ? 0.05 : 0.03;
                    playTone(note, 0.22, "triangle", accent);
                    bgmStep++;
                }, 260);
            }

            function stopBgm() {
                if (!bgmIntervalId) {
                    return;
                }

                clearInterval(bgmIntervalId);
                bgmIntervalId = null;
            }

            function playHitSound() {
                ensureAudioContext();
                if (!audioContext) {
                    return;
                }

                const now = audioContext.currentTime;
                const oscillator = audioContext.createOscillator();
                const gainNode = audioContext.createGain();

                oscillator.type = "square";
                oscillator.frequency.setValueAtTime(320, now);
                oscillator.frequency.exponentialRampToValueAtTime(
                    120,
                    now + 0.08,
                );

                gainNode.gain.setValueAtTime(0.0001, now);
                gainNode.gain.linearRampToValueAtTime(0.09, now + 0.01);
                gainNode.gain.exponentialRampToValueAtTime(0.0001, now + 0.1);

                oscillator.connect(gainNode);
                gainNode.connect(audioContext.destination);

                oscillator.start(now);
                oscillator.stop(now + 0.12);
            }

                if (Math.random() < angryChance) {
                    return "angry";
                }

                const calmExpressions = ["happy", "wink", "surprised"];
                return calmExpressions[
                    Math.floor(Math.random() * calmExpressions.length)
                ];
            }

            function setMoleExpression(id, expressionKey) {
                const expressionBox = document.getElementById(
                    `expression-${id}`,
                );
                if (!expressionBox) {
                    return;
                }

                const expressionMarkup = getExpressionMarkup(expressionKey);
                expressionBox.innerHTML = `${expressionMarkup.eyeMarkup}${expressionMarkup.mouthMarkup}`;
            }

            function renderMoleMarkup(moleId, expressionKey) {
                const expression = getExpressionMarkup(expressionKey);

                return `
                    <div class="pointer-events-none flex h-full w-full flex-col items-center justify-center pt-2">
                        <div class="moleFace relative h-14 w-16 rounded-[42%] border-2 border-amber-50/70 bg-gradient-to-b from-amber-200 to-amber-500 shadow-[inset_0_6px_10px_rgba(255,255,255,0.35)]">
                            <div class="absolute -top-2 left-1 h-3 w-3 rounded-full border border-amber-100/60 bg-amber-300"></div>
                            <div class="absolute -top-2 right-1 h-3 w-3 rounded-full border border-amber-100/60 bg-amber-300"></div>
                            <div id="expression-${moleId}">
                                ${expression.eyeMarkup}
                                ${expression.mouthMarkup}
                            </div>
                        </div>
                        <p class="mt-1 text-[10px] font-black tracking-[0.22em] text-amber-100">MOLE</p>
                        <div class="mt-1 h-2.5 w-16 overflow-hidden rounded-full bg-rose-950/80 ring-1 ring-rose-300/20">
                            <div class="hp-fill h-full rounded-full bg-gradient-to-r from-lime-300 via-emerald-400 to-teal-500" id="hp-${moleId}" style="width:100%"></div>
                        </div>
                    </div>
                `;
            }

            // 게임 시작
            function startGame() {
                if (gameActive) return;

                if (playerHp <= 0) {
                    resetRunProgress();
                }

                gameActive = true;
                isGameOverState = false;
                updateShareButtonLabel();
                setGameTouchLock(true);
                scrollToGameBoard();
                timeLeft = STAGE_TIME;
                document.getElementById("start-btn").style.display = "none";
                startBgm();
                updateUI();

                // 타이머 구동
                gameTimer = setInterval(() => {
                    timeLeft--;
                    updateUI();

                    if (timeLeft <= 0) {
                        endStage();
                    }
                }, 1000);

                // 두더지 출현 루프 시작
                spawnMoleLoop();
            }

            // 두더지 리스폰 제어 (스테이지가 오를수록 리스폰 주기가 빨라짐)
            function spawnMoleLoop() {
                if (!gameActive) return;

                const delay = Math.max(300, 1000 - stage * 80); // 스테이지 상승시 더 자주 나옴
                popMole();

                moleTimer = setTimeout(spawnMoleLoop, delay);
            }

            // 두더지 튀어나오기
            function popMole() {
                const activeMoles = moles.filter((m) => !m.isUp);
                if (activeMoles.length === 0) return;

                // 랜덤 두더지 선택
                const randMole =
                    activeMoles[Math.floor(Math.random() * activeMoles.length)];
                const el = moleElements[randMole.id];

                // 스테이지 비례 체력 설정 (스테이지당 최대 체력 15씩 증가)
                randMole.maxHp = 10 + (stage - 1) * 15;
                randMole.hp = randMole.maxHp;
                randMole.isUp = true;
                randMole.isFrozen = false;
                randMole.isShocked = false;
                randMole.baseExpressionKey = getSpawnExpressionKey();
                clearTimeout(randMole.hitFaceTimeoutId);
                randMole.hitFaceTimeoutId = null;

                // 두더지 UI 구성 (체력바 포함)
                el.innerHTML = renderMoleMarkup(
                    randMole.id,
                    randMole.baseExpressionKey,
                );
                el.className = "mole up";

                // 두더지가 들어가는 시간도 스테이지가 오를수록 빨라짐
                const upTime = Math.max(800, 2500 - stage * 150);

                randMole.timeoutId = setTimeout(() => {
                    downMole(randMole.id, "escaped");
                }, upTime);
            }

            // 두더지 들어가기
            function downMole(id, reason = "escaped") {
                const mole = moles[id];
                if (!mole.isUp) return;

                // 빙결 상태면 들어가기 타이머 유예
                if (mole.isFrozen) {
                    mole.timeoutId = setTimeout(
                        () => downMole(id, reason),
                        1000,
                    );
                    return;
                }

                if (reason === "escaped" && gameActive) {
                    const missDamage = Math.min(28, 8 + Math.floor(stage * 2));
                    changePlayerHp(-missDamage);
                }

                mole.isUp = false;
                moleElements[id].className = "mole";
                moleElements[id].innerHTML = "";
                clearTimeout(mole.timeoutId);
                clearTimeout(mole.hitFaceTimeoutId);
                mole.hitFaceTimeoutId = null;
            }

            // 뿅망치 타격 (클릭 이벤트)
            function handleMoleHit(event) {
                event.preventDefault();
                const id = parseInt(
                    event.currentTarget.getAttribute("data-id"),
                );
                if (!moles[id].isUp) return;

                playHitSound();

                // 1. 기본 타격 수행
                hitMole(id, playerStats.damage);

                // --- 특수 스킬 중첩 발동 체크 ---
                // 2. 얼음 스킬 (빙결)
                if (Math.random() * 100 < playerStats.iceChance) {
                    triggerIce(id);
                }

                // 3. 광범위 스킬 (주변 타격 - 상하좌우 및 대각선 타격)
                if (Math.random() * 100 < playerStats.aoeChance) {
                    triggerAoe(id);
                }

                // 4. 전기 스킬 (체인이 되어 살아있는 다른 타겟 공격)
                if (Math.random() * 100 < playerStats.elecChance) {
                    triggerElectric(id);
                }
            }

            moleElements.forEach((el) => {
                el.addEventListener("pointerdown", handleMoleHit);
            });

            document.addEventListener(
                "touchmove",
                (event) => {
                    const gameBoardSection = event.target.closest(
                        "#game-board-section",
                    );
                    if (gameActive && gameBoardSection) {
                        event.preventDefault();
                    }
                },
                { passive: false },
            );

            // 개별 두더지 데미지 계산 및 처리
            function hitMole(id, damage) {
                const mole = moles[id];
                if (!mole.isUp) return;

                setMoleExpression(id, "grimace");
                clearTimeout(mole.hitFaceTimeoutId);
                mole.hitFaceTimeoutId = setTimeout(() => {
                    if (!moles[id].isUp) {
                        return;
                    }

                    setMoleExpression(id, moles[id].baseExpressionKey);
                }, 200);

                mole.hp -= damage;

                // 체력바 업데이트
                const hpFill = document.getElementById(`hp-${id}`);
                if (hpFill) {
                    const percent = Math.max(0, (mole.hp / mole.maxHp) * 100);
                    hpFill.style.width = percent + "%";
                }

                // 두더지 사망 처리
                if (mole.hp <= 0) {
                    score += mole.maxHp; // 강한 두더지일수록 점수 가산
                    changePlayerHp(KILL_HEAL_AMOUNT);
                    updateUI();
                    downMole(id, "killed");
                }
            }

            function changePlayerHp(delta) {
                playerHp = Math.max(
                    0,
                    Math.min(PLAYER_MAX_HP, playerHp + delta),
                );
                updateUI();

                if (playerHp <= 0 && gameActive) {
                    gameOver();
                }
            }

            // [얼음 스킬 효과] 두더지를 얼려 움직이지 못하게 만듦
            function triggerIce(id) {
                const mole = moles[id];
                if (!mole.isUp || mole.isFrozen) return;

                mole.isFrozen = true;
                moleElements[id].classList.add("frozen");

                // 3초 후 빙결 해제
                setTimeout(() => {
                    if (moles[id]) {
                        moles[id].isFrozen = false;
                        moleElements[id].classList.remove("frozen");
                    }
                }, 3000);
            }

            // [광범위 스킬 효과] 격자 배열 기준 주변 두더지들에게 스플래시 데미지
            function triggerAoe(centerId) {
                const neighbors = [centerId - 3, centerId + 3];
                if (centerId % 3 !== 0)
                    neighbors.push(centerId - 1, centerId - 4, centerId + 2);
                if (centerId % 3 !== 2)
                    neighbors.push(centerId + 1, centerId - 2, centerId + 4);

                neighbors.forEach((nid) => {
                    if (nid >= 0 && nid < 9 && moles[nid].isUp) {
                        hitMole(nid, Math.floor(playerStats.damage * 0.7));
                    }
                });
            }

            // [전기 스킬 효과] 튀어나와 있는 임의의 다른 두더지에게 번개 전도
            function triggerElectric(originId) {
                const otherMoles = moles.filter(
                    (m) => m.isUp && m.id !== originId,
                );
                if (otherMoles.length === 0) return;

                const chainTarget =
                    otherMoles[Math.floor(Math.random() * otherMoles.length)];
                const targetEl = moleElements[chainTarget.id];

                targetEl.classList.add("shocked");
                hitMole(chainTarget.id, Math.floor(playerStats.damage * 0.8));

                setTimeout(() => {
                    targetEl.classList.remove("shocked");
                }, 200);
            }

            // 스테이지 종료 및 시간 버티기 성공
            function endStage() {
                gameActive = false;
                setGameTouchLock(false);
                clearInterval(gameTimer);
                clearTimeout(moleTimer);
                stopBgm();

                moles.forEach((m) => {
                    if (m.isUp) downMole(m.id, "cleanup");
                });
                openRewardModal();
            }

            function resetRunProgress() {
                stage = 1;
                score = 0;
                timeLeft = STAGE_TIME;
                playerHp = PLAYER_MAX_HP;
                isGameOverState = false;
                updateShareButtonLabel();
                setGameTouchLock(false);
                playerStats.damage = 10;
                playerStats.iceChance = 0;
                playerStats.aoeChance = 0;
                playerStats.elecChance = 0;
                moles.forEach((mole) => {
                    mole.hp = 10;
                    mole.maxHp = 10;
                    mole.isUp = false;
                    mole.isFrozen = false;
                    mole.isShocked = false;
                    mole.baseExpressionKey = "happy";
                    clearTimeout(mole.timeoutId);
                    clearTimeout(mole.hitFaceTimeoutId);
                    mole.timeoutId = null;
                    mole.hitFaceTimeoutId = null;
                });

                moleElements.forEach((el) => {
                    el.className = "mole";
                    el.innerHTML = "";
                });

                document.getElementById("card-modal").style.display = "none";
                document.getElementById("start-btn").innerText = "게임 시작";
                updateUI();
            }

            function gameOver() {
                gameActive = false;
                isGameOverState = true;
                updateShareButtonLabel();
                setGameTouchLock(false);
                clearInterval(gameTimer);
                clearTimeout(moleTimer);
                stopBgm();
                moles.forEach((m) => {
                    if (m.isUp) downMole(m.id, "cleanup");
                });

                alert(`게임 오버! 최종 점수: ${score}`);
                document.getElementById("start-btn").style.display =
                    "inline-block";
                document.getElementById("start-btn").innerText = "다시 시작";
            }

            function buildScoreShareText() {
                return `초인 뿅망치 디펜스 기록\n스테이지: ${stage}\n점수: ${score}\n플레이어 HP: ${playerHp}`;
            }

            function buildGeneralShareText() {
                return "초인 뿅망치 디펜스 같이 하자! 망치 리듬게임 도전해봐 🔨";
            }

            function getShareContentByState() {
                if (isGameOverState) {
                    return {
                        title: "초인 뿅망치 디펜스 결과",
                        text: buildScoreShareText(),
                        description: `게임오버 기록 | 스테이지 ${stage} | 점수 ${score} | HP ${playerHp}\nhttps://ijy5154.github.io/whack/`,
                    };
                }

                return {
                    title: "초인 뿅망치 디펜스",
                    text: buildGeneralShareText(),
                    description:
                        "초인 뿅망치 디펜스 같이 하자! 리듬감으로 두더지 싹쓸이 🔨\nhttps://ijy5154.github.io/whack/",
                };
            }

            async function shareScoreToFriend() {
                const shareContent = getShareContentByState();
                const shareText = shareContent.text;
                const shareUrl = shareTargetUrl;
                const sharePayload = {
                    title: shareContent.title,
                    text: shareText,
                    url: shareUrl,
                };

                if (
                    window.Kakao &&
                    window.Kakao.isInitialized &&
                    window.Kakao.isInitialized() &&
                    window.Kakao.Share
                ) {
                    window.Kakao.Share.sendDefault({
                        objectType: "feed",
                        content: {
                            title: shareContent.title,
                            description: shareContent.description,
                            imageUrl:
                                "https://images.unsplash.com/photo-1511512578047-dfb367046420?auto=format&fit=crop&w=1200&q=80",
                            link: {
                                mobileWebUrl: shareUrl,
                                webUrl: shareUrl,
                            },
                        },
                        buttons: [
                            {
                                title: "게임 열기",
                                link: {
                                    mobileWebUrl: shareUrl,
                                    webUrl: shareUrl,
                                },
                            },
                        ],
                    });
                    return;
                }

                try {
                    if (navigator.share) {
                        await navigator.share(sharePayload);
                        return;
                    }
                } catch (error) {
                    if (error && error.name === "AbortError") {
                        return;
                    }
                }

                const fallbackText = `${shareText}\n${shareUrl}`;

                try {
                    await navigator.clipboard.writeText(fallbackText);
                    alert(
                        "공유 메뉴를 사용할 수 없어 점수 문구를 복사했어요. 카카오톡 채팅창에 붙여넣어 주세요.",
                    );
                } catch (error) {
                    window.prompt(
                        "아래 내용을 복사해서 카카오톡에 붙여넣어 주세요.",
                        fallbackText,
                    );
                }
            }

            initKakaoShare();
            updateShareButtonLabel();

            // 랜덤 카드 3개 추첨 및 모달 오픈
            function openRewardModal() {
                const modal = document.getElementById("card-modal");
                const cardListContainer = document.getElementById("card-list");
                cardListContainer.innerHTML = "";

                const shuffled = [...cardPool].sort(() => 0.5 - Math.random());
                const selectedCards = shuffled.slice(0, 3);

                selectedCards.forEach((cardData) => {
                    const cardEl = document.createElement("div");
                    cardEl.className = "card";
                    cardEl.innerHTML = `
                    <h3>${cardData.title}</h3>
                    <p>${cardData.desc}</p>
                `;
                    cardEl.onclick = () => selectCard(cardData);
                    cardListContainer.appendChild(cardEl);
                });

                modal.style.display = "flex";
            }

            // 카드 선택 및 다음 스테이지 준비
            function selectCard(cardData) {
                cardData.effect();
                document.getElementById("card-modal").style.display = "none";
                stage++;
                updateUI();

                document.getElementById("start-btn").style.display =
                    "inline-block";
                document.getElementById("start-btn").innerText =
                    `스테이지 ${stage} 시작`;
            }
        </script>
    </body>
</html>
